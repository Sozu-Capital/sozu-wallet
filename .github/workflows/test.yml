name: test

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: PILOT_MAINNET reachability gate
        run: bun run test:pilot-gate
      - name: Unit tests
        run: bun run test
