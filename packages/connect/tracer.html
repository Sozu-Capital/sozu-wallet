<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sozu Connect tracer</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 2rem;
        max-width: 40rem;
      }
      label {
        display: block;
        margin-bottom: 0.75rem;
      }
      input {
        width: 100%;
        margin-top: 0.25rem;
      }
      pre {
        background: #111;
        color: #eee;
        padding: 1rem;
        min-height: 6rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Login with Sozu</h1>
    <p>Opens <code>/auth?connect=1</code> and prints the account the popup posts back.</p>
    <label>
      Wallet origin
      <input id="origin" value="http://localhost:3000" />
    </label>
    <button id="login" type="button">Login with Sozu</button>
    <pre id="out">waiting</pre>
    <script>
      const originInput = document.getElementById("origin")
      const out = document.getElementById("out")
      let popup = null
      let sawResult = false

      window.addEventListener("message", (event) => {
        const walletOrigin = originInput.value.trim().replace(/\/$/, "")
        if (event.origin !== walletOrigin) return
        const data = event.data
        if (!data || data.type !== "sozu-connect") return
        sawResult = true
        out.textContent = JSON.stringify(
          data.error
            ? { error: data.error }
            : { username: data.username, accountId: data.accountId },
          null,
          2,
        )
      })

      document.getElementById("login").addEventListener("click", () => {
        const walletOrigin = originInput.value.trim().replace(/\/$/, "")
        sawResult = false
        popup = window.open(
          walletOrigin + "/auth?connect=1",
          "sozu-connect",
          "popup,width=420,height=720",
        )
        out.textContent = popup ? "popup opened" : "popup blocked"
        const timer = setInterval(() => {
          if (!popup || !popup.closed) return
          clearInterval(timer)
          if (!sawResult) out.textContent = JSON.stringify({ error: "popup_closed" }, null, 2)
        }, 300)
      })
    </script>
  </body>
</html>
